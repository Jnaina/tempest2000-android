plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jnaina.tempest2000'
    compileSdk 34
    ndkVersion '27.3.13750724'

    defaultConfig {
        applicationId 'com.jnaina.tempest2000'
        minSdk 26                      // AAudio (low-latency audio) needs Android 8.0
        targetSdk 34
        versionCode 1
        versionName '1.0'
        ndk { abiFilters 'arm64-v8a', 'x86_64' } // phones / Apple-silicon emulator, and x86_64 emulators (Intel Mac, Linux, Windows)
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // installable without a keystore; replace with your own to publish
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
