name: build-apk
on: [push, pull_request, workflow_dispatch]
jobs:
  apk:
    name: APK on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'windows-latest' }}   # Windows builds through Git Bash; treated as experimental
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          SDKM=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager* | head -1)
          yes | "$SDKM" --licenses >/dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "cmake;3.22.1" "ndk;27.3.13750724" >/dev/null
      - name: Fetch and assemble the game and the core
        run: ./setup.sh
      - name: Build the APK
        run: ./build.sh
      - name: Check the APK
        run: unzip -l Tempest2000-debug.apk | grep -E "libt2k.so|t2000.abs"
